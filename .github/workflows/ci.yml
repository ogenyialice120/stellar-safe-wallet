name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Build WASM (wasm32v1-none)
        run: >
          cargo build --release --target wasm32v1-none
          --manifest-path contracts/safe-wallet/Cargo.toml

      - name: Claims audit
        run: bash scripts/check_claims.sh

      - name: Install shellcheck
        run: |
          curl -sL "https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz" \
            -o /tmp/sc.tar.xz
          tar xJf /tmp/sc.tar.xz -C /tmp
          sudo mv /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/multi-auth/package-lock.json

      - name: Install multi-auth Node dependencies
        run: npm ci --prefix scripts/multi-auth

      - name: Run multi-auth tests
        run: npm test --prefix scripts/multi-auth
