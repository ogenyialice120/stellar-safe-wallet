[workspace]
resolver = "2"
members = [
    "contracts/safe-wallet",
]

[workspace.package]
rust-version = "1.88.0"

[workspace.dependencies]
soroban-sdk = { version = "=22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# soroban-env-host 22.1.3 pulls in ed25519-dalek 3.0.0, which depends on
# rand_core 0.6 via its own re-export.  rand 0.8 (also pulled in) uses
# rand_core 0.6 from a *different* semver-incompatible resolution, causing a
# trait-implementation conflict at compile time in the testutils build.
# The git tag below is the version that soroban-sdk 22.x was originally tested
# against and that correctly unifies the rand_core dependency.
[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.2.0" }
