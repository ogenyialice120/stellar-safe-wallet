[workspace]
resolver = "2"
members = [
    "contracts/safe-wallet",
]

[workspace.package]
rust-version = "1.88.0"

[workspace.dependencies]
soroban-sdk = { version = "=22.0.11" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# soroban-env-host 22.1.3 (pulled by soroban-sdk 22.0.11) depends on
# ed25519-dalek 3.0.0, which uses rand_core 0.9 (via curve25519-dalek 5).
# The same soroban-env-host also pulls rand_chacha 0.3, which uses rand_core
# 0.6. These two rand_core versions cannot satisfy a single trait bound in the
# testutils build, causing a compile error. The patch below replaces
# ed25519-dalek 3.0.0 with the 2.2.0 tag, which uses rand_core 0.6 throughout,
# eliminating the conflict. The WASM output is unaffected (the guest target
# does not link ed25519-dalek at all).
#
# Evidence: tested with =22.0.11 WITHOUT this patch — `cargo test` and `cargo
# clippy --all-targets` both fail with:
#   error[E0277]: the trait bound `ChaCha20Rng: TryRng` is not satisfied
#   note: required for `ChaCha20Rng` to implement `ed25519_dalek::rand_core::CryptoRng`
# Tested with =22.0.11 WITH this patch — all 49 tests pass, clippy is clean,
# WASM builds to 11730 bytes with identical exports. See _CHANGELOG.md Task 2
# entry for the full evidence matrix.
[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", tag = "ed25519-2.2.0" }
